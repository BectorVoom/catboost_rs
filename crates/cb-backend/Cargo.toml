[package]
name = "cb-backend"
version = "0.1.0"
edition = "2021"
description = "Sole feature-gated runtime-alias owner for catboost-rs (CubeCL runtime wired in Phase 7)"

[lints]
workspace = true

[dependencies]
# D-02: cb-backend is the SINGLE feature-gated runtime-alias owner. As of Phase 3
# (D-01) the `cpu` arm stands up the real CubeCL CPU runtime here — `cubecl` and
# `bytemuck` live in THIS crate ONLY (D-03 keeps `cb-compute` cubecl-free). As of
# Phase 7.1 (D-7.1-01) the `wgpu`/`cuda`/`rocm` arms resolve to real CubeCL runtimes
# (`WgpuRuntime`/`CudaRuntime`/`HipRuntime`) — see `lib.rs` `SelectedRuntime` — and
# are no longer inert placeholders.
# NO per-backend crates. NOTE: `anyhow` is intentionally absent (D-14 structural
# ban). Do not add it.
cubecl.workspace = true
bytemuck.workspace = true
# cb-backend implements cb-compute's abstract Runtime trait by launching the
# `#[cube]` kernels (D-03 keeps cubecl OUT of cb-compute, not the reverse).
cb-compute = { path = "../cb-compute" }
cb-core = { path = "../cb-core" }
# Host-side parallelism for the per-fit prep transforms (cindex pack, value-range
# validation) — order-preserving `par_*` only, so outputs stay byte-identical to the
# serial loops (GPU round-3 perf pass).
rayon.workspace = true

[features]
# Compile-time backend selection only — NO runtime dispatch (D-02). Each backend
# feature forwards to its cubecl facade feature (D-7.1-02 / RESEARCH Pitfall 1):
# selection lives HERE, not on the workspace cubecl pin, so a
# `--no-default-features --features rocm` build is cpu-free (pulls only cubecl/hip).
# NOTE: rocm -> `cubecl/hip` (the cubecl facade names the AMD/ROCm runtime `hip`).
# Do NOT add `cubecl-hip-sys/hip_xxx` here — the sys build.rs auto-detects the HIP
# patch from `hipconfig` and panics on manual feature pinning (RESEARCH Pitfall 2).
default = ["cpu"]
cpu = ["cubecl/cpu"]
wgpu = ["cubecl/wgpu"]
cuda = ["cubecl/cuda"]
rocm = ["cubecl/hip"]
# `wgpu` with the Metal Shading Language compiler path (`cubecl/wgpu-msl` ->
# `cubecl-wgpu/msl`), i.e. wgpu emitting MSL for a Metal device instead of routing
# through naga's WGSL path. This is a SHADER-BACKEND VARIANT of the existing `wgpu`
# arm, NOT a fifth runtime: `SelectedRuntime` stays `cubecl::wgpu::WgpuRuntime` and
# every `#[cfg(feature = "wgpu")]` arm in `lib.rs` / `gpu_runtime` must keep applying.
#
# That is why this enables our OWN `wgpu` feature as well as the cubecl one. Without
# it, `--no-default-features --features wgpu-msl` would turn on `cubecl/wgpu` (via
# cubecl's own `wgpu-msl = ["wgpu", ...]`) while leaving cb-backend's `wgpu` cfg OFF —
# so no `SelectedRuntime` arm would match and the crate would fail to compile with a
# confusing "cannot find type SelectedRuntime" rather than a feature error.
#
# Selection still lives here rather than on the workspace `cubecl` pin, so a
# `--features wgpu-msl` build stays cpu-free (the feature-unification landmine noted
# above). cubecl also spells this `metal = ["wgpu-msl"]`; we forward the explicit
# `wgpu-msl` name so the shader path is visible at the call site.
wgpu-msl = ["wgpu", "cubecl/wgpu-msl"]

[dev-dependencies]
# Test-only (D-14/D-15 permit dev edges): the Poisson bootstrap self-oracle reads the
# committed `cb-oracle/fixtures/bootstrap_poisson/` `.npy` + `config.json` produced by
# `poisson_bootstrap_oracle.cpp` (the verbatim host transcription of upstream's CUDA
# kernel). Deliberately NOT a `cb-oracle` dev-dependency: cb-oracle's own dev-deps pull
# cb-backend WITH a backend feature, and that edge would unify `cpu` into a
# `--features rocm` build (the feature-unification landmine). Reading two files needs
# neither the crate nor the risk.
ndarray.workspace = true
ndarray-npy.workspace = true
serde_json.workspace = true
